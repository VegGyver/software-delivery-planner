name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @software-delivery-planner/shared build

      - name: Typecheck shared package
        run: pnpm --filter @software-delivery-planner/shared typecheck

      - name: Typecheck API
        run: pnpm --filter @software-delivery-planner/api typecheck

      - name: Test API
        run: pnpm --filter @software-delivery-planner/api test

      - name: Typecheck web
        run: pnpm --filter @software-delivery-planner/web typecheck

      - name: Build web
        run: pnpm --filter @software-delivery-planner/web build